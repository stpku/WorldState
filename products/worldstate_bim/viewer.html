<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorldState BIM · 局部构件工作台</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#1d302e;background:#f3f5f1;font-size:15px}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;justify-content:space-between;background:#173d36;color:#fff;padding:18px 4vw;gap:20px}header strong{font-size:20px;letter-spacing:-.04em}header span{color:#c8dbd3;font-size:12px}main{max-width:1440px;margin:auto;padding:26px 4vw 50px}.lead{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:20px}h1{font-size:27px;margin:0 0 7px}p{line-height:1.5;margin:0;color:#63746e}.tag{display:inline-block;background:#fff0cd;color:#795006;border-radius:30px;padding:7px 12px;font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1.1fr;gap:18px}.panel{background:#fff;border:1px solid #dfe8e1;border-radius:14px;overflow:hidden;box-shadow:0 5px 18px #213c2d0a}.panel h2{font-size:15px;margin:0;padding:18px 20px;border-bottom:1px solid #edf1ed}.photo{position:relative;background:#182b29;aspect-ratio:4/3}.photo img,.photo svg{position:absolute;width:100%;height:100%;object-fit:contain;inset:0}.photo svg rect{stroke:#d4fb94;stroke-width:3;fill:#d4fb9422}.viewer{height:360px;background:linear-gradient(#f3f8f4,#e8f0e9);display:grid;place-items:center}canvas{width:100%;height:100%;cursor:grab;touch-action:none}.caption{padding:12px 20px;font-size:12px;color:#687c72}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 20px 20px}.metric{border:1px solid #e5ece6;border-radius:9px;padding:12px}.metric span{display:block;color:#72847a;font-size:12px}.metric b{display:block;margin-top:6px;font-size:17px}.controls{padding:0 20px 20px;display:flex;gap:10px;align-items:end;flex-wrap:wrap}label{font-weight:600;font-size:12px;display:grid;gap:6px;color:#435e53}input{font:inherit;border:1px solid #cbd9ce;border-radius:7px;padding:10px;width:130px}button,a.action{border:0;border-radius:8px;background:#1e6c52;color:white;padding:11px 16px;font:inherit;font-weight:650;cursor:pointer;text-decoration:none;display:inline-block}a.secondary{background:#eaf2ec;color:#24543d}.evidence{padding:18px 20px;border-top:1px solid #edf1ed;line-height:1.6;color:#53695d;font-size:13px}.evidence strong{color:#273f32}.error{padding:0 20px 16px;color:#a63f2c;min-height:20px}.footer{padding-top:22px;color:#6f8075;font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.lead{align-items:start;flex-direction:column}.meta{grid-template-columns:repeat(3,1fr)}header span{display:none}.viewer{height:300px}}
</style>
</head>
<body>
<header><strong>◈ WorldState <span> / BIM</span></strong><span>Evidence-to-Editable World · 本地工作台</span></header>
<main>
<div class="lead"><div><h1>可见墙面 · 局部草稿</h1><p>照片与深度辅助生成的参数化构件；拖动右侧模型可旋转。</p></div><div class="tag">未验证 · 非完整房间</div></div>
<div class="grid">
<section class="panel"><h2>01　原始照片与人工选区</h2><div class="photo"><img src="/api/photo" alt="输入证据照片"><svg id="roi" viewBox="0 0 640 480" preserveAspectRatio="xMidYMid meet" aria-label="人工选择的照片区域"><rect id="roi-box"></rect></svg></div><div class="caption">亮框为人工选择区域；该图片不证明遮挡后的墙体范围。</div><div class="evidence"><strong>证据状态</strong><div id="evidence"></div></div></section>
<section class="panel"><h2>02　参数化墙面预览</h2><div class="viewer"><canvas id="scene" width="900" height="540" aria-label="可拖动旋转的墙体草稿预览"></canvas></div><div class="caption">该盒体是可见片段及假设厚度，不表示完整墙体。</div><div class="meta"><div class="metric"><span>片段长度</span><b id="length">—</b></div><div class="metric"><span>可见高度</span><b id="height">—</b></div><div class="metric"><span>假设厚度</span><b id="thickness">—</b></div></div><div class="controls"><label>修改长度（米）<input id="new-length" type="number" min="0.001" step="0.01"></label><label>修改说明<input id="reason" type="text" maxlength="100" placeholder="例如：人工修订"></label><button id="save">保存新版本</button><a class="action secondary" href="/api/model.ifc" download="worldstate-draft.ifc">下载当前 IFC</a></div><div class="error" id="status" role="status"></div><div class="evidence"><strong>尚未确认</strong><div id="unknown"></div><div id="revision"></div></div></section>
</div><div class="footer">本地运行 · 修订后需要重新验证 · 模型及源图不会自动发布</div>
</main>
<script>
const token="__WS_TOKEN__";let model=null,yaw=-0.55,pitch=-0.35,drag=null;
const $=id=>document.getElementById(id);const canvas=$("scene"),ctx=canvas.getContext("2d");
function render(){if(!model)return;const p=model.elements[0].parameters,L=p.length.value,H=p.visible_height.value,T=p.thickness.value,scale=Math.min(520,350/Math.max(L,H,T));ctx.clearRect(0,0,canvas.width,canvas.height);const pts=[];for(let x of [0,L])for(let y of [0,T])for(let z of [0,H]){let X=x-L/2,Y=y-T/2,Z=z-H/2;let a=X*Math.cos(yaw)-Y*Math.sin(yaw),b=X*Math.sin(yaw)+Y*Math.cos(yaw),c=Z*Math.cos(pitch)-b*Math.sin(pitch);pts.push([canvas.width/2+a*scale,canvas.height/2-c*scale]);}const edges=[[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]];ctx.lineWidth=4;ctx.strokeStyle="#247151";for(const [a,b] of edges){ctx.beginPath();ctx.moveTo(...pts[a]);ctx.lineTo(...pts[b]);ctx.stroke()}ctx.fillStyle="#547768";ctx.font="22px system-ui";ctx.fillText("拖动旋转 · 可见片段",24,40)}
function show(data){model=data;let w=data.elements[0],p=w.parameters,photo=data.evidence.find(e=>e.id==="photo-1");$("length").textContent=p.length.value.toFixed(3)+" m";$("height").textContent=p.visible_height.value.toFixed(3)+" m";$("thickness").textContent=p.thickness.value.toFixed(3)+" m";$("new-length").value=p.length.value.toFixed(3);const labels={"full wall boundary":"完整墙界","actual wall thickness":"实际墙厚","full wall height":"完整墙高","building coordinates":"建筑坐标","unseen openings":"未观测开口"};$("unknown").textContent=w.unknown.map(x=>labels[x]||x).join(" · ");$("revision").textContent="版本 "+data.revision+" · "+(data.validation.status==="REQUIRES_REVALIDATION"?"待重新验证":"未验证草稿");let scaleSource=data.scale.independence==="same_sensor"?"同一深度传感器":"用户声明的独立测量（待核验）";$("evidence").textContent="照片 SHA-256 "+photo.sha256.slice(0,16)+"…；尺度来源："+scaleSource+"；厚度为假设。";$("roi").setAttribute("viewBox",`0 0 ${photo.width_px} ${photo.height_px}`);let r=data.evidence.find(e=>e.id==="operator-1").roi_xyxy;let box=$("roi-box");box.setAttribute("x",r[0]);box.setAttribute("y",r[1]);box.setAttribute("width",r[2]-r[0]);box.setAttribute("height",r[3]-r[1]);render()}
canvas.addEventListener("pointerdown",e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)});canvas.addEventListener("pointermove",e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.01;pitch+=(e.clientY-drag[1])*.01;drag=[e.clientX,e.clientY];render()});canvas.addEventListener("pointerup",()=>drag=null);
$("save").addEventListener("click",async()=>{let length=Number($("new-length").value),reason=$("reason").value.trim();if(!Number.isFinite(length)||length<=0||!reason){$("status").textContent="请输入正数长度和修改说明。";return}$("save").disabled=true;try{let r=await fetch("/api/revise",{method:"POST",headers:{"Content-Type":"application/json","X-WorldState-Token":token},body:JSON.stringify({wall_id:model.elements[0].id,length_m:length,reason})});let d=await r.json();if(!r.ok)throw Error(d.error||"保存失败");show(d.model);$("status").textContent="新版本已保存。来源和几何需要重新验证。"}catch(e){$("status").textContent=e.message}finally{$("save").disabled=false}});
fetch("/api/model").then(r=>r.json()).then(show).catch(()=>{$("status").textContent="无法读取本地模型。"});
</script>
</body></html>
