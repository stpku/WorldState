  <text x="46" y="78" font-family="sans-serif" font-size="16" fill="#4b6070">Architecture proposal · 2026-11-13 · states refer to specific capabilities</text>
  <g font-family="sans-serif" font-size="16" fill="#203944" text-anchor="middle">
    <rect x="45" y="125" width="190" height="112" rx="12" fill="#e5f5eb" stroke="#4f9b6d" stroke-width="2"/><text x="140" y="158">Evidence</text><text x="140" y="184">RGB-D / scale input</text><text x="140" y="215" fill="#247343">PARTIAL</text>
    <rect x="275" y="125" width="190" height="112" rx="12" fill="#fff6df" stroke="#cb9c26" stroke-width="2"/><text x="370" y="158">Reconstruction</text><text x="370" y="184">COLMAP / depth / scan</text><text x="370" y="215" fill="#895d00">RESEARCH</text>
    <rect x="505" y="125" width="190" height="112" rx="12" fill="#fff6df" stroke="#cb9c26" stroke-width="2"/><text x="600" y="158">Semantics</text><text x="600" y="184">single wall patch IR</text><text x="600" y="215" fill="#895d00">PARTIAL</text>
    <rect x="735" y="125" width="190" height="112" rx="12" fill="#e5f5eb" stroke="#4f9b6d" stroke-width="2"/><text x="830" y="158">IFC authoring</text><text x="830" y="184">real wall patches</text><text x="830" y="215" fill="#247343">PARTIAL</text>
    <rect x="965" y="125" width="190" height="112" rx="12" fill="#fff6df" stroke="#cb9c26" stroke-width="2"/><text x="1060" y="158">Verify / evolve</text><text x="1060" y="184">edit / readback</text><text x="1060" y="215" fill="#895d00">PARTIAL</text>
  </g>
  <g stroke="#4b6070" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M235 181 H265"/><path d="M465 181 H495"/><path d="M695 181 H725"/><path d="M925 181 H955"/><path d="M1060 242 V277 H600 V246"/></g>
  <rect x="45" y="330" width="515" height="100" rx="12" fill="#e5f5eb" stroke="#4f9b6d" stroke-width="2"/>
  <text x="65" y="363" font-family="sans-serif" font-size="18" fill="#203944">WorldState Core · IMPLEMENTED FOUNDATION</text><text x="65" y="391" font-family="sans-serif" font-size="15" fill="#405a68">provenance · validity · Unknown / Conflict · history</text><text x="65" y="414" font-family="sans-serif" font-size="14" fill="#405a68">BIM evidence projection is planned, not yet implemented</text>
  <rect x="610" y="330" width="545" height="100" rx="12" fill="#fff" stroke="#aab8c2" stroke-width="2"/>
  <text x="630" y="363" font-family="sans-serif" font-size="18" fill="#203944">Replaceable modeling Harness · PLANNED ADAPTER</text><text x="630" y="391" font-family="sans-serif" font-size="15" fill="#405a68">DSH or alternatives · bounded tools · explicit permissions</text><text x="630" y="414" font-family="sans-serif" font-size="14" fill="#405a68">GeoTask and AgentReality remain independent external systems</text>
  <text x="45" y="489" font-family="sans-serif" font-size="16" fill="#405a68">Research result ≠ verified geometry ≠ editable, validated BIM</text>
  <text x="45" y="520" font-family="sans-serif" font-size="14" fill="#647681">Implemented: green · Research: amber · Planned: white</text>
