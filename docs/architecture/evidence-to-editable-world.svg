<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">WorldState — Evidence-to-Editable World</title>
  <desc id="desc">Evidence to reconstruction to semantic parameters to IFC to verification; current Core and an external, planned harness, with labels distinguishing implemented, experimental and planned capabilities.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4b6070"/></marker></defs>
  <rect width="1200" height="580" fill="#f8fafb"/>
